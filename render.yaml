services:
  - type: web
    name: elevator-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "Elevator AI"
      - key: APP_VERSION
        value: "0.1.0"
      - key: CORS_ORIGINS
        value: "https://elevator-ai.netlify.app"
      - key: DATABASE_URL
        fromDatabase:
          name: elevator-ai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: elevator-ai-db
    databaseName: elevator_ai
    user: elevator_user
